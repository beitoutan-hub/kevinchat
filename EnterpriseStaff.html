
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="員工姓名、部門與分機號碼對照表">
    <title>員工分機對照表</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            color: #333;
            background-color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 480px;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 12px 16px;
            border: 1px solid #ccc;
        }

        thead th {
            background-color: #f2f2f2;
            font-weight: bold;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tbody tr:hover {
            background-color: #eef5ff;
        }

        .employee-name {
            font-weight: bold;
            color: #333;
        }

        .extension {
            color: #0056b3;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 20px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>
